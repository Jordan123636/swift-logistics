<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Tracking — Swift Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #8DC63F;
    --green-dark: #6fa52e;
    --green-light: #eef7de;
    --green-mid: #c5e48a;
    --white: #ffffff;
    --off-white: #f8faf4;
    --gray-100: #f3f4f0;
    --gray-200: #e5e7e0;
    --gray-400: #a8aca0;
    --gray-600: #6b6f64;
    --gray-800: #2e3028;
    --font-display: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
  }

  body { font-family: var(--font-body); background-color: var(--off-white); color: var(--gray-800); min-height: 100vh; }

  /* ── NAV ── */
  nav {
    background: var(--white);
    border-bottom: 1.5px solid var(--gray-200);
    padding: 0 2rem;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.4rem;
    color: var(--gray-800);
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }

  .logo-dot { width: 10px; height: 10px; background: var(--green); border-radius: 50%; display: inline-block; }

  .nav-back {
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--gray-600);
    text-decoration: none;
    transition: color 0.2s;
  }

  .nav-back:hover { color: var(--green-dark); }

  /* ── HERO BAND ── */
  .hero-band {
    background: var(--green);
    padding: 2.5rem 2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .hero-band::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 200px; height: 200px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }

  .hero-band h1 { font-family: var(--font-display); font-size: 1.75rem; font-weight: 700; color: var(--white); position: relative; }
  .hero-band p { font-size: 0.9rem; color: rgba(255,255,255,0.85); margin-top: 4px; position: relative; }

  /* ── LAYOUT ── */
  .page-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 1.5rem;
    align-items: start;
  }

  @media (max-width: 760px) {
    .page-wrap { grid-template-columns: 1fr; }
  }

  /* ── LOADING / ERROR STATE ── */
  .state-screen {
    grid-column: 1 / -1;
    text-align: center;
    padding: 4rem 2rem;
  }

  .state-icon { font-size: 3rem; margin-bottom: 1rem; }
  .state-title { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; color: var(--gray-800); }
  .state-sub { font-size: 0.9rem; color: var(--gray-600); margin-top: 6px; }

  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--gray-200);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 1rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── CARDS ── */
  .card {
    background: var(--white);
    border-radius: 16px;
    border: 1.5px solid var(--gray-200);
    overflow: hidden;
  }

  .card-header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1.5px solid var(--gray-200);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-header h2 { font-family: var(--font-display); font-size: 1rem; font-weight: 700; color: var(--gray-800); }

  .badge { font-size: 0.75rem; font-weight: 500; padding: 4px 12px; border-radius: 100px; }
  .badge-green   { background: var(--green-light); color: var(--green-dark); }
  .badge-gray    { background: var(--gray-100); color: var(--gray-600); }
  .badge-pending { background: #FFF8E1; color: #b45309; }
  .badge-done    { background: #e8f5e9; color: #2e7d32; }

  /* ── META BAR ── */
  .order-meta {
    padding: 1rem 1.5rem;
    display: flex;
    gap: 2rem;
    border-bottom: 1.5px solid var(--gray-200);
    flex-wrap: wrap;
  }

  .meta-item label {
    display: block;
    font-size: 0.7rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--gray-400);
    margin-bottom: 2px;
  }

  .meta-item span { font-size: 0.875rem; font-weight: 500; color: var(--gray-800); }
  .meta-item .highlight { color: var(--green-dark); font-weight: 600; }

  /* ── PROGRESS BAR ── */
  .progress-strip {
    margin: 0 1.5rem 1.5rem;
    background: var(--gray-100);
    border-radius: 100px;
    height: 6px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 100px;
    width: 0%;
    transition: width 1.2s cubic-bezier(0.4,0,0.2,1);
  }

  /* ── STEPS ── */
  .tracking-body { padding: 2rem 1.5rem; }
  .steps { position: relative; }

  .step {
    display: flex;
    gap: 1.25rem;
    position: relative;
    padding-bottom: 2rem;
    animation: fadeSlideIn 0.5s ease both;
  }

  .step:last-child { padding-bottom: 0; }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateX(-12px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .step:nth-child(1) { animation-delay: 0.05s; }
  .step:nth-child(2) { animation-delay: 0.15s; }
  .step:nth-child(3) { animation-delay: 0.25s; }
  .step:nth-child(4) { animation-delay: 0.35s; }

  .step:not(:last-child) .step-icon::after {
    content: '';
    position: absolute;
    top: 44px; left: 19px;
    width: 2px;
    height: calc(100% - 12px);
    border-left: 2px dashed var(--gray-200);
  }

  .step.done:not(:last-child) .step-icon::after { border-left: 2px solid var(--green-mid); }

  .step-icon { flex-shrink: 0; position: relative; }

  .step-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    transition: all 0.3s ease;
    position: relative;
    z-index: 1;
  }

  .step.done .step-circle {
    background: var(--green);
    color: var(--white);
    box-shadow: 0 0 0 4px var(--green-light);
  }

  .step.active .step-circle {
    background: var(--white);
    border: 2.5px solid var(--green);
    color: var(--green);
    box-shadow: 0 0 0 4px var(--green-light);
    animation: pulse 1.8s ease infinite;
  }

  .step.pending .step-circle {
    background: var(--gray-100);
    border: 2px solid var(--gray-200);
    color: var(--gray-400);
  }

  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 4px rgba(141,198,63,0.2); }
    50%      { box-shadow: 0 0 0 8px rgba(141,198,63,0.08); }
  }

  .step-content { flex: 1; padding-top: 6px; }
  .step-title { font-family: var(--font-display); font-size: 0.95rem; font-weight: 700; color: var(--gray-800); line-height: 1.3; }
  .step.pending .step-title { color: var(--gray-400); }
  .step-desc { font-size: 0.8rem; color: var(--gray-600); margin-top: 2px; line-height: 1.5; }
  .step.pending .step-desc { color: var(--gray-400); }
  .step-time { font-size: 0.75rem; color: var(--gray-400); margin-top: 4px; }
  .step.active .step-time { color: var(--green-dark); font-weight: 500; }

  /* ── SIDEBAR ── */
  .sidebar { display: flex; flex-direction: column; gap: 1.25rem; }

  .courier-wrap { padding: 1.25rem 1.5rem; }

  .courier-row { display: flex; align-items: center; gap: 1rem; }

  .courier-avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--green-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--green-dark);
    flex-shrink: 0;
  }

  .courier-info p { font-size: 0.9rem; font-weight: 600; color: var(--gray-800); }
  .courier-info span { font-size: 0.78rem; color: var(--gray-400); }

  .rating-row { display: flex; gap: 3px; margin-top: 4px; }
  .star { color: var(--green); font-size: 0.85rem; }
  .star.empty { color: var(--gray-200); }

  .addr-wrap { padding: 1.25rem 1.5rem; }

  .addr-row { display: flex; gap: 12px; margin-bottom: 0.75rem; }
  .addr-row:last-child { margin-bottom: 0; }

  .addr-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    flex-shrink: 0;
  }

  .addr-icon.from { background: #FFF8E1; }
  .addr-icon.to   { background: var(--green-light); }

  .addr-text label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--gray-400); font-weight: 500; }
  .addr-text p { font-size: 0.85rem; color: var(--gray-800); font-weight: 500; margin-top: 1px; }

  .addr-divider { margin: 0 0 0.75rem 15px; width: 2px; height: 16px; background: var(--gray-200); }

  .footer-note {
    text-align: center;
    font-size: 0.78rem;
    color: var(--gray-400);
    padding: 0 2rem 2rem;
    max-width: 900px;
    margin: 0 auto;
  }

  .footer-note a { color: var(--green-dark); text-decoration: none; }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="nexlog.html" class="logo">
    <span class="logo-dot"></span>
    Swift Logistics
  </a>
  <a href="nexlog.html" class="nav-back">← Back to Home</a>
</nav>

<!-- HERO BAND -->
<div class="hero-band">
  <h1>Track Your Order</h1>
  <p>Real-time updates on your delivery status</p>
</div>

<!-- MAIN CONTENT -->
<div class="page-wrap" id="pageWrap">

  <!-- Loading state -->
  <div class="state-screen" id="loadingState">
    <div class="spinner"></div>
    <div class="state-title">Looking up your shipment...</div>
    <div class="state-sub">Fetching live data from our network</div>
  </div>

</div>

<p class="footer-note">
  Need help? <a href="nexlog.html#contact">Contact Support</a> · Updates sent to your registered email
</p>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>

<script>

// ── COURIERS pool (random assignment based on tracking ID) ──
const COURIERS = [
  { name: 'Akin Oyelaran',   initials: 'AO', rating: 4.8, deliveries: '1,240' },
  { name: 'Chidi Nwosu',     initials: 'CN', rating: 4.9, deliveries: '2,105' },
  { name: 'Fatima Bello',    initials: 'FB', rating: 4.7, deliveries: '987'   },
  { name: 'Emeka Eze',       initials: 'EE', rating: 4.6, deliveries: '1,532' },
  { name: 'Ngozi Adeyemi',   initials: 'NA', rating: 5.0, deliveries: '3,002' },
];

// ── STATUS STAGES ──
// Based on hours elapsed since paidAt — can never go backwards
const STAGES = [
  {
    key: 'confirmed',
    title: 'Order Confirmed',
    desc: 'Your quote has been received and payment confirmed. Our team is preparing your shipment.',
    icon: '✓',
    hoursMin: 0
  },
  {
    key: 'picked_up',
    title: 'Shipment Picked Up',
    desc: 'Your package has been collected and handed to our courier team for processing.',
    icon: '📦',
    hoursMin: 2
  },
  {
    key: 'in_transit',
    title: 'In Transit',
    desc: 'Your package is on its way. Our driver is currently en route to the destination hub.',
    icon: '🚚',
    hoursMin: 8
  },
  {
    key: 'out_for_delivery',
    title: 'Out for Delivery',
    desc: 'Your package has arrived at the local hub and is out for final delivery to your address.',
    icon: '🏠',
    hoursMin: 48
  },
  {
    key: 'delivered',
    title: 'Order Delivered',
    desc: 'Your package has been successfully delivered. Thank you for choosing Swift Logistics!',
    icon: '🎉',
    hoursMin: 96
  }
];

// ── HELPERS ──
function formatDate(isoStr) {
  const d = new Date(isoStr);
  return d.toLocaleDateString('en-NG', { month: 'short', day: '2-digit', year: 'numeric' });
}

function formatDateTime(isoStr) {
  const d = new Date(isoStr);
  return d.toLocaleDateString('en-NG', { month: 'short', day: '2-digit', year: 'numeric' }) +
    ' · ' + d.toLocaleTimeString('en-NG', { hour: '2-digit', minute: '2-digit' });
}

function addDays(isoStr, days) {
  const d = new Date(isoStr);
  d.setDate(d.getDate() + days);
  return formatDate(d.toISOString());
}

// Get current stage index based on hours elapsed — never goes backwards
function getCurrentStage(paidAt) {
  const now = new Date();
  const paid = new Date(paidAt);
  const hoursElapsed = (now - paid) / (1000 * 60 * 60);

  let stage = 0;
  for (let i = 0; i < STAGES.length; i++) {
    if (hoursElapsed >= STAGES[i].hoursMin) stage = i;
  }
  return stage;
}

// Pick a deterministic courier from the tracking ID
function pickCourier(trackingId) {
  let hash = 0;
  for (let i = 0; i < trackingId.length; i++) hash += trackingId.charCodeAt(i);
  return COURIERS[hash % COURIERS.length];
}

// ── RENDER PAGE ──
function renderPage(order) {
  const paidAt = order.paidAt || order.submittedAt;
  const currentStageIndex = getCurrentStage(paidAt);
  const currentStage = STAGES[currentStageIndex];
  const progressPct = Math.round((currentStageIndex / (STAGES.length - 1)) * 100);
  const courier = pickCourier(order.trackingId);

  // Badge color
  const badgeClass = currentStageIndex === STAGES.length - 1 ? 'badge-done' : 'badge-green';
  const badgeLabel = currentStageIndex === STAGES.length - 1 ? '✓ Delivered' : '● ' + currentStage.title;

  // Build steps HTML
  let stepsHTML = '';
  STAGES.forEach((stage, i) => {
    let stepClass = 'pending';
    let circleContent = stage.icon;
    let timeLabel = 'Pending';

    if (i < currentStageIndex) {
      stepClass = 'done';
      circleContent = '✓';
      // Approximate time for completed stages
      const h = stage.hoursMin;
      const stageDate = new Date(new Date(paidAt).getTime() + h * 60 * 60 * 1000);
      timeLabel = formatDateTime(stageDate.toISOString());
    } else if (i === currentStageIndex) {
      stepClass = 'active';
      timeLabel = 'In progress — Last update: ' + formatDateTime(new Date().toISOString());
    }

    stepsHTML += `
      <div class="step ${stepClass}">
        <div class="step-icon">
          <div class="step-circle">${circleContent}</div>
        </div>
        <div class="step-content">
          <div class="step-title">${stage.title}</div>
          <div class="step-desc">${stage.desc}</div>
          <div class="step-time">${timeLabel}</div>
        </div>
      </div>`;
  });

  // Build stars HTML
  const fullStars = Math.floor(courier.rating);
  let starsHTML = '';
  for (let i = 0; i < 5; i++) {
    starsHTML += `<span class="star${i >= fullStars ? ' empty' : ''}">★</span>`;
  }

  const html = `
    <!-- LEFT: TRACKING CARD -->
    <div>
      <div class="card">
        <div class="card-header">
          <h2>Order #${order.trackingId}</h2>
          <span class="badge ${badgeClass}">${badgeLabel}</span>
        </div>

        <div class="order-meta">
          <div class="meta-item">
            <label>Placed On</label>
            <span>${formatDate(paidAt)}</span>
          </div>
          <div class="meta-item">
            <label>Est. Delivery</label>
            <span class="highlight">${addDays(paidAt, 5)}</span>
          </div>
          <div class="meta-item">
            <label>Service</label>
            <span>${order.serviceType || 'Express Shipping'}</span>
          </div>
          <div class="meta-item">
            <label>Customer</label>
            <span>${order.fullName || '—'}</span>
          </div>
          ${order.weight ? `<div class="meta-item"><label>Weight</label><span>${order.weight} kg</span></div>` : ''}
        </div>

        <div class="progress-strip">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="tracking-body">
          <div class="steps">${stepsHTML}</div>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDEBAR -->
    <div class="sidebar">

      <!-- Courier -->
      <div class="card">
        <div class="card-header">
          <h2>Your Courier</h2>
          <span class="badge badge-gray">${currentStageIndex >= STAGES.length - 1 ? 'Completed' : 'Active'}</span>
        </div>
        <div class="courier-wrap">
          <div class="courier-row">
            <div class="courier-avatar">${courier.initials}</div>
            <div class="courier-info">
              <p>${courier.name}</p>
              <div class="rating-row">${starsHTML}</div>
              <span>${courier.rating} · ${courier.deliveries} deliveries</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Route -->
      <div class="card">
        <div class="card-header">
          <h2>Delivery Route</h2>
        </div>
        <div class="addr-wrap">
          <div class="addr-row">
            <div class="addr-icon from">📍</div>
            <div class="addr-text">
              <label>From</label>
              <p>${order.origin || '—'}</p>
            </div>
          </div>
          <div class="addr-divider"></div>
          <div class="addr-row">
            <div class="addr-icon to">🏠</div>
            <div class="addr-text">
              <label>To</label>
              <p>${order.destination || '—'}</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Order details -->
      <div class="card">
        <div class="card-header">
          <h2>Shipment Details</h2>
        </div>
        <div class="addr-wrap">
          ${order.details ? `<p style="font-size:0.85rem;color:var(--gray-600);line-height:1.6;">${order.details}</p>` : '<p style="font-size:0.85rem;color:var(--gray-400);">No additional details provided.</p>'}
        </div>
      </div>

    </div>`;

  const wrap = document.getElementById('pageWrap');
  wrap.innerHTML = html;

  // Animate progress bar after render
  setTimeout(() => {
    const fill = document.getElementById('progressFill');
    if (fill) fill.style.width = progressPct + '%';
  }, 200);
}

// ── RENDER NOT FOUND ──
function renderNotFound(trackingId) {
  document.getElementById('pageWrap').innerHTML = `
    <div class="state-screen">
      <div class="state-icon">🔍</div>
      <div class="state-title">Shipment Not Found</div>
      <div class="state-sub">No order found for tracking ID <strong>${trackingId}</strong>.<br>Please check the ID and try again.</div>
      <a href="nexlog.html#tracking" style="display:inline-block;margin-top:1.5rem;background:var(--green);color:white;padding:10px 24px;border-radius:100px;text-decoration:none;font-weight:500;font-size:0.9rem;">Try Again</a>
    </div>`;
}

// ── MAIN: Read tracking ID from URL and fetch from Firestore ──
window.addEventListener('load', async () => {
  const params = new URLSearchParams(window.location.search);
  const trackingId = params.get('id');

  if (!trackingId) {
    renderNotFound('(none provided)');
    return;
  }

  try {
    const snapshot = await db.collection('quotes')
      .where('trackingId', '==', trackingId)
      .limit(1)
      .get();

    if (snapshot.empty) {
      renderNotFound(trackingId);
      return;
    }

    const order = snapshot.docs[0].data();
    renderPage(order);

  } catch (err) {
    console.error('Error fetching order:', err);
    document.getElementById('pageWrap').innerHTML = `
      <div class="state-screen">
        <div class="state-icon">⚠️</div>
        <div class="state-title">Something went wrong</div>
        <div class="state-sub">Could not connect to our servers. Please try again shortly.</div>
        <a href="nexlog.html#tracking" style="display:inline-block;margin-top:1.5rem;background:var(--green);color:white;padding:10px 24px;border-radius:100px;text-decoration:none;font-weight:500;font-size:0.9rem;">Go Back</a>
      </div>`;
  }
});

</script>
</body>
</html>
